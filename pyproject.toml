[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[project]
name = "polars_to_ibis"
authors = [{name = "The OpenDP Project", email = "contact@opendp.org"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
version = "0.3.0"
description = "Convert Polars LazyFrames to Ibis unbound tables"
dependencies = [
    "ibis-framework",
    "polars>=1.32.0",
]
requires-python = ">=3.10"

[project.urls]
Home = "https://github.com/opendp/polars-to-ibis"
Documentation = "https://opendp.github.io/polars-to-ibis"

[tool.pyright]
include = ["polars_to_ibis"]
strict = ["**"]

[tool.isort]
profile = "black"
skip_glob = [".venv*/*"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
polars-to-ibis = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ibis-framework[duckdb,mysql,polars,postgres,sqlite]>=12.0.0",
    "opendp[polars]==0.15.1",
    "pdoc>=16.0.0",
    "polars>=1.32.0",
    "pre-commit>=4.6.0",
    "psycopg-binary>=3.3.4",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "tomlkit>=0.15.0",
]
