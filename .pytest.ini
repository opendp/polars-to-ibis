[pytest]

filterwarnings =
	# Treat warnings as errors...
	error
	# Except for these, which should be addressed at some point:
	ignore:'json' serialization format of LazyFrame is deprecated:UserWarning
	ignore:.*Jupyter is migrating.*:DeprecationWarning
	ignore:Unable to set session timezone to UTC.*:UserWarning
	ignore::pytest.PytestUnraisableExceptionWarning
	ignore:fetch_arrow_table\(\) is deprecated, use to_arrow_table\(\) instead.:DeprecationWarning

addopts = --doctest-glob '*.md' --doctest-modules

# If an xfail starts passing unexpectedly, that should count as a failure:
xfail_strict=true

markers =
    extra_install: Database engine requires extra install, outside python.
