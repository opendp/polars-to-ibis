name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-14 # So DB startup works the same in CI as locally.
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
        polars-version:
          # TODO: Old, but may be supported?
          # - '1.32.0' # OpenDP v0.14.1

          # Current
          - '1.36.1' # OpenDP v0.15.1

          # Next higher
          # - '1.41.2'
          # NOTE: Update README ("Limitations") if there are changes.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start databases
        run: scripts/setup.sh

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.11.24"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Confirm polars version
        run: diff <( echo ${{ matrix.polars-version }} ) <( uv run python -c 'import polars; print(polars.__version__)' )

      - name: Confirm python version
        run: diff <( echo "Python ${{ matrix.python-version }}" ) <( uv run python --version )

      - name: Test
        # TODO: Remove --stepwise
        run: uv run scripts/ci.sh --stepwise
